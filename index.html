<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.app{max-width:390px;margin:0 auto;background:white;min-height:100vh;display:flex;flex-direction:column;}

/* TOP BAR — beige */
.topbar{background:#F5F0E8;padding:12px 16px 10px;border-bottom:1px solid #DDD5C4;flex-shrink:0;}
.topbar-logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.topbar-logo-img{height:80px;width:auto;object-fit:contain;}
.topbar-title{font-size:15px;font-weight:500;color:#3D2B1F;opacity:.7;}
.search-wrap{padding:0;}
.search-input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #C8BCAA;font-size:15px;background:white;color:#222;}
.search-input::placeholder{color:#AAA;}
.search-input:focus{outline:none;border-color:#4A7C59;}

/* HERO */
.hero{position:relative;height:180px;overflow:hidden;flex-shrink:0;}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 40%;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.5));}
.hero-text{position:absolute;bottom:14px;left:16px;color:white;}
.hero-text h2{font-size:21px;font-weight:600;line-height:1.2;}
.hero-text p{font-size:13px;opacity:.85;margin-top:3px;}

/* HOME CATEGORY BUTTONS */
.home-body{padding:16px 14px 24px;flex:1;}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:10px;}
.cat-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;background:white;border:1.5px solid #E0E0E0;border-radius:10px;margin-bottom:9px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;}
.cat-btn:hover{border-color:#4A7C59;background:#f7faf8;}
.cat-btn-left{display:flex;align-items:center;gap:12px;}
.cat-icon{font-size:22px;width:32px;text-align:center;}
.cat-btn-label{font-size:16px;font-weight:500;color:#111;}
.cat-btn-sub{font-size:12px;color:#888;margin-top:1px;}
.cat-arrow{font-size:18px;color:#BBB;}

/* SUN STEP */
.step-body{padding:16px 14px 24px;flex:1;}
.breadcrumb{font-size:13px;color:#4A7C59;cursor:pointer;font-weight:500;margin-bottom:16px;display:inline-flex;align-items:center;gap:4px;}
.step-title{font-size:20px;font-weight:600;color:#111;margin-bottom:4px;}
.step-sub{font-size:14px;color:#666;margin-bottom:20px;}
.sun-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:white;border:1.5px solid #E0E0E0;border-radius:10px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s;}
.sun-btn:hover{border-color:#4A7C59;background:#f7faf8;}
.sun-btn.on{border-color:#1A4D2E;background:#f0f7f2;}
.sun-icon{font-size:28px;width:36px;text-align:center;}
.sun-label{font-size:16px;font-weight:500;color:#111;}
.sun-desc{font-size:12px;color:#888;margin-top:2px;}

/* RESULTS */
.results-header{padding:10px 14px 0;}
.sort-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid #EEE;flex-wrap:wrap;}
.sort-label{font-size:12px;color:#888;margin-right:2px;}
.sort-btn{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid #DDD;background:transparent;color:#888;cursor:pointer;}
.sort-btn.on{background:#1A4D2E;color:white;border-color:#1A4D2E;}
.rcount{font-size:12px;color:#888;margin-left:auto;}
.plant-list{padding:0 14px 20px;}
.pcard{background:white;border:1px solid #EEE;border-radius:10px;padding:12px 14px;margin:10px 0;cursor:pointer;}
.pcard:hover{border-color:#4A7C59;}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.pname{font-size:15px;font-weight:500;color:#111;line-height:1.3;}
.pbot{font-size:11px;color:#888;font-style:italic;margin-top:2px;}
.cbadge{flex-shrink:0;font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px;}
.attrs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;}
.attr{font-size:12px;color:#666;}
.attr b{color:#111;font-weight:500;}
.ptag{font-size:16px;font-weight:500;color:#1A4D2E;margin-top:8px;}
.psku{font-size:11px;color:#AAA;margin-top:1px;}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:3px;vertical-align:middle;}

/* DETAIL */
.dv{padding:14px 16px 24px;}
.dback{font-size:13px;color:#4A7C59;cursor:pointer;font-weight:500;margin-bottom:14px;display:block;}
.dname{font-size:20px;font-weight:500;color:#111;line-height:1.3;}
.dbot{font-size:13px;color:#888;font-style:italic;margin-top:3px;}
.dprice{font-size:24px;font-weight:500;color:#1A4D2E;margin-top:10px;}
.dsku{font-size:12px;color:#888;margin-top:2px;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.dtile{background:#f8f8f8;border-radius:8px;padding:10px 12px;}
.tlabel{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#999;}
.tval{font-size:14px;font-weight:500;color:#111;margin-top:3px;line-height:1.3;}
.abtn{width:100%;margin-top:14px;padding:12px;background:#1A4D2E;color:white;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;}
.abtn.open{background:#f0f0f0;color:#444;border:1px solid #DDD;}
.adv{margin-top:12px;padding:14px;background:#f8f8f8;border-radius:10px;}
.adv-title{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.arow{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.arow label{font-size:13px;color:#666;width:76px;flex-shrink:0;}
.arow select{flex:1;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid #DDD;background:white;color:#111;}
.rcard{background:white;border:1px solid #EEE;border-radius:8px;padding:11px 13px;margin-bottom:8px;cursor:pointer;}
.rcard:hover{border-color:#4A7C59;}
.rname{font-size:14px;font-weight:500;color:#111;}
.rwhy{font-size:12px;color:#888;margin-top:3px;}
.rprice{font-size:13px;font-weight:500;color:#1A4D2E;margin-top:4px;}
.empty{text-align:center;padding:2.5rem 1rem;color:#888;font-size:14px;line-height:1.6;}
.search-results-screen{padding:10px 14px 24px;flex:1;}
.search-results-label{font-size:12px;color:#888;padding:8px 0 4px;}
</style>

const DISPLAY_CATS = [
  {id:'Perennial', label:'Perennials', icon:'🌸', sub:'Hostas included',          dbCats:['Perennial','Hosta']},
  {id:'Tree',      label:'Trees',      icon:'🌳', sub:'Shade & ornamental',         dbCats:['Tree']},
  {id:'Shrub',     label:'Shrubs',     icon:'🌿', sub:'Structure & blooms',         dbCats:['Shrub']},
  {id:'Grass',     label:'Grasses',    icon:'🌾', sub:'Ornamental grasses',         dbCats:['Grass']},
  {id:'Groundcover',label:'Groundcovers',icon:'🍃',sub:'Low-growing spreaders',    dbCats:['Groundcover']},
  {id:'Vine',      label:'Vines',      icon:'🌱', sub:'Climbers & trailers',        dbCats:['Vine']},
  {id:'Fruit',     label:'Fruits',     icon:'🍎', sub:'Edible plants',              dbCats:['Fruit']},
];

const SUN_OPTS = [
  {id:'Full Sun',       label:'Full Sun',   icon:'☀️',  desc:'6+ hours of direct sun daily'},
  {id:'Part Sun/Shade', label:'Part Shade', icon:'⛅',  desc:'3–6 hours of sun, filtered light'},
  {id:'Full Shade',     label:'Full Shade', icon:'🌥️', desc:'Less than 3 hours of direct sun'},
];

const CC={Perennial:['#EAF3DE','#27500A'],Hosta:['#EAF3DE','#27500A'],Shrub:['#FAEEDA','#633806'],Tree:['#FBEAF0','#72243E'],Evergreen:['#E6F1FB','#0C447C'],Grass:['#FFF8E7','#854F0B'],Groundcover:['#EAF3DE','#3B6D11'],Native:['#D6EAD8','#1A4D2E'],Fruit:['#FBEAF0','#72243E'],Vine:['#EEEDFE','#3C3489'],};
const SC={'Full Sun':'#D4820A','Part Sun/Shade':'#3B6D11','Full Shade':'#1A4D2E'};
const SIZES=['Small container','Medium container','Large container','Specimen','B&B'];

let S={screen:'home',q:'',selCat:null,selSun:null,sort:'name',sel:null,adv:false,af:{sun:'',sz:'',zone:''}};

function badge(cat,sm){const[bg,fg]=CC[cat]||['#eee','#333'];const lbl=cat==='Hosta'?'Perennial':cat;return'<span class="cbadge" style="background:'+bg+';color:'+fg+';font-size:'+(sm?'10px':'11px')+'">'+lbl+'</span>';}
function dot(sun){return'<span class="sdot" style="background:'+(SC[sun]||'#888')+'"></span>';}

function activeCats(){
  if(!S.selCat)return[];
  const dc=DISPLAY_CATS.find(c=>c.id===S.selCat);
  return dc?dc.dbCats:[];
}

function filt(){
  const cats=activeCats();
  return PL.filter(p=>{
    const q=S.q.toLowerCase();
    if(q&&!p.name.toLowerCase().includes(q)&&!p.bot.toLowerCase().includes(q)&&!p.sku.toLowerCase().includes(q)&&!p.cat.toLowerCase().includes(q))return false;
    if(cats.length&&!cats.includes(p.cat))return false;
    if(S.selSun&&!p.sunList.includes(S.selSun))return false;
    return true;
  });
}

function filtSearch(){
  const q=S.q.toLowerCase();
  if(!q)return[];
  return PL.filter(p=>p.name.toLowerCase().includes(q)||p.bot.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)).slice(0,40);
}

function srt(arr){return[...arr].sort((a,b)=>{if(S.sort==='price')return a.price-b.price;if(S.sort==='price_d')return b.price-a.price;if(S.sort==='cat')return a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name);if(S.sort==='size')return SIZES.indexOf(a.sn)-SIZES.indexOf(b.sn);return a.name.localeCompare(b.name);});}

function topbar(showSearch=true){return'<div class="topbar"><div class="topbar-logo-wrap"><img class="topbar-logo-img" src="'+LOGO_SRC+'" alt="Missy\'s Plant Guide"><span class="topbar-title">Plant Guide 2026</span></div>'+(showSearch?'<div class="search-wrap"><input class="search-input" placeholder="Search any plant by name or SKU…" value="'+S.q+'" oninput="sq(this.value)"></div>':'')+'</div>';}

function renderHome(){
  const catBtns=DISPLAY_CATS.map(c=>'<button class="cat-btn" onclick="pickCat(\''+ c.id+'\')">'+
    '<div class="cat-btn-left"><span class="cat-icon">'+c.icon+'</span>'+
    '<div><div class="cat-btn-label">'+c.label+'</div><div class="cat-btn-sub">'+c.sub+'</div></div></div>'+
    '<span class="cat-arrow">›</span></button>').join('');
  document.getElementById('app').innerHTML=topbar(true)+
    '<div class="hero"><img src="'+HERO_SRC+'" alt="Garden"><div class="hero-overlay"></div>'+
    '<div class="hero-text"><h2>Find the right plant</h2><p>Help customers choose with confidence</p></div></div>'+
    '<div class="home-body"><div class="section-label">What type of plant?</div>'+catBtns+'</div>';
}

function renderSunStep(){
  const dc=DISPLAY_CATS.find(c=>c.id===S.selCat);
  const sunBtns=SUN_OPTS.map(s=>'<button class="sun-btn'+(S.selSun===s.id?' on':'')+'" onclick="pickSun(\''+ s.id+'\')">'+
    '<span class="sun-icon">'+s.icon+'</span>'+
    '<div><div class="sun-label">'+s.label+'</div><div class="sun-desc">'+s.desc+'</div></div></button>').join('');
  document.getElementById('app').innerHTML=topbar(true)+
    '<div class="step-body"><span class="breadcrumb" onclick="goHome()">‹ '+(dc?dc.label:'Back')+'</span>'+
    '<div class="step-title">Where will it be planted?</div>'+
    '<div class="step-sub">Select the sun exposure for the customer\'s location.</div>'+
    sunBtns+'</div>';
}

function cardHtml(p){
  return'<div class="pcard" onclick="sd(\''+ p.sku+'\')">'+
    '<div class="ptop"><div><div class="pname">'+p.name+'</div>'+(p.bot?'<div class="pbot">'+p.bot+'</div>':'')+'</div>'+badge(p.cat)+'</div>'+
    '<div class="attrs">'+
      '<div class="attr">'+ dot(p.sun)+'<b>'+p.sun+'</b></div>'+
      (p.h?'<div class="attr">H: <b>'+p.h+'</b></div>':'')+
      (p.w?'<div class="attr">W: <b>'+p.w+'</b></div>':'')+
      (p.zone?'<div class="attr">Zone <b>'+p.zone+'</b></div>':'')+
      (p.season?'<div class="attr"><b>'+p.season+'</b></div>':'')+
      (p.fc&&p.fc!=='n/a'&&p.fc!=='n.a.'?'<div class="attr"><b>'+p.fc+'</b></div>':'')+
    '</div>'+
    '<div class="ptag">$'+(p.price>0?p.price.toFixed(2):'—')+' <span style="font-size:12px;font-weight:400;color:#888">'+p.size+'</span></div>'+
    '<div class="psku">SKU: '+p.sku+'</div></div>';
}

function renderResults(){
  const dc=DISPLAY_CATS.find(c=>c.id===S.selCat);
  const sunLabel=SUN_OPTS.find(s=>s.id===S.selSun);
  const res=srt(filt());
  const sortBtns=[['name','A–Z'],['price','$ Low'],['price_d','$ High'],['size','Size']].map(([k,l])=>'<button class="sort-btn'+(S.sort===k?' on':'')+'" onclick="ss(\''+ k+'\')">'+l+'</button>').join('');
  let cards=res.slice(0,100).map(cardHtml).join('');
  if(!cards)cards='<div class="empty">No plants match.<br>Try a different sun exposure.</div>';
  else if(res.length>100)cards+='<div class="empty">Showing 100 of '+res.length+' — refine search to see more</div>';
  document.getElementById('app').innerHTML=topbar(true)+
    '<div class="results-header"><span class="breadcrumb" onclick="goSun()">‹ '+(dc?dc.label:'')+' · '+(sunLabel?sunLabel.label:'')+'</span></div>'+
    '<div class="sort-bar"><span class="sort-label">Sort:</span>'+sortBtns+'<span class="rcount">'+res.length+' plants</span></div>'+
    '<div class="plant-list">'+cards+'</div>';
}

function renderSearch(){
  const res=filtSearch();
  let cards=res.map(cardHtml).join('');
  if(!cards)cards='<div class="empty">No results for "'+S.q+'"</div>';
  document.getElementById('app').innerHTML=topbar(true)+
    '<div class="search-results-screen">'+
    '<div class="search-results-label">'+res.length+' result'+(res.length!==1?'s':'')+' for "'+S.q+'" — <span style="color:#4A7C59;cursor:pointer" onclick="clearSearch()">clear</span></div>'+
    cards+'</div>';
}

function renderDetail(){
  const p=PL.find(x=>x.sku===S.sel);
  if(!p){render();return;}
  const colorLine=[p.fc&&p.fc!=='n/a'&&p.fc!=='n.a.'?'Flowers: '+p.fc:'',p.lc?'Foliage: '+p.lc:''].filter(Boolean).join(' · ');
  const sunTags=p.sunList.map(s=>'<span style="background:'+(CC[s]?'#eee':'#eee')+';border-radius:4px;padding:2px 6px;font-size:12px;margin-right:4px">'+ dot(s)+s+'</span>').join('');
  document.getElementById('app').innerHTML=topbar(false)+
    '<div class="dv">'+
    '<span class="dback" onclick="goBack()">← Back to results</span>'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
      '<div><div class="dname">'+p.name+'</div>'+(p.bot?'<div class="dbot">'+p.bot+'</div>':'')+'</div>'+badge(p.cat)+
    '</div>'+
    '<div class="dprice">'+(p.price>0?'$'+p.price.toFixed(2):'Call for price')+'</div>'+
    '<div class="dsku">SKU: '+p.sku+' · '+p.size+'</div>'+
    '<div class="dgrid">'+
      '<div class="dtile"><div class="tlabel">Sunlight</div><div class="tval">'+ sunTags+'</div></div>'+
      '<div class="dtile"><div class="tlabel">USDA Zone</div><div class="tval">Zone '+p.zone+'</div></div>'+
      '<div class="dtile"><div class="tlabel">Height</div><div class="tval">'+(p.h||'—')+'</div></div>'+
      '<div class="dtile"><div class="tlabel">Spread</div><div class="tval">'+(p.w||'—')+'</div></div>'+
      (colorLine?'<div class="dtile" style="grid-column:span 2"><div class="tlabel">Color</div><div class="tval">'+colorLine+'</div></div>':'')+
      (p.season?'<div class="dtile" style="grid-column:span 2"><div class="tlabel">Bloom Season</div><div class="tval">'+p.season+'</div></div>':'')+
    '</div>'+
    '<button class="abtn'+(S.adv?' open':'')+'" onclick="ta()">'+(S.adv?'Hide customer advisor':'Find alternatives for a customer')+'</button>'+
    (S.adv?buildAdv(p):'')+
    '</div>';
}

function buildAdv(cur){
  const szOpts=SIZES.map(s=>'<option value="'+s+'"'+(S.af.sz===s?' selected':'')+'>'+s+'</option>').join('');
  const sunOpts=SUN_OPTS.map(s=>'<option value="'+s.id+'"'+(S.af.sun===s.id?' selected':'')+'>'+s.label+'</option>').join('');
  const zOpts=[2,3,4,5,6,7,8,9].map(z=>'<option value="'+z+'"'+(S.af.zone==z?' selected':'')+'>Zone '+z+'</option>').join('');
  const cats=activeCats().length?activeCats():PL.map(p=>p.cat);
  const recs=PL.filter(p=>{
    if(p.sku===cur.sku)return false;
    if(!cats.includes(p.cat))return false;
    if(S.af.sun&&!p.sunList.includes(S.af.sun))return false;
    if(S.af.sz&&p.sn!==S.af.sz)return false;
    if(S.af.zone&&parseInt(p.zone)>parseInt(S.af.zone))return false;
    return true;
  }).slice(0,6);
  const rcards=recs.length?recs.map(p=>'<div class="rcard" onclick="sd(\''+ p.sku+'\')">'+
    '<div class="rname">'+p.name+' '+badge(p.cat,true)+'</div>'+
    '<div class="rwhy">'+ dot(p.sun)+p.sun+' · '+p.size+(p.zone?' · Zone '+p.zone:'')+'</div>'+
    '<div class="rprice">$'+(p.price>0?p.price.toFixed(2):'—')+' · '+p.size+'</div></div>').join(''):'<div class="empty" style="padding:.75rem 0">Adjust filters above to see alternatives</div>';
  return '<div class="adv"><div class="adv-title">Customer advisor</div>'+
    '<div class="arow"><label>Sun</label><select onchange="sa(\'sun\',this.value)"><option value="">Any</option>'+sunOpts+'</select></div>'+
    '<div class="arow"><label>Container</label><select onchange="sa(\'sz\',this.value)"><option value="">Any size</option>'+szOpts+'</select></div>'+
    '<div class="arow"><label>Zone</label><select onchange="sa(\'zone\',this.value)"><option value="">Any zone</option>'+zOpts+'</select></div>'+
    '<div style="font-size:12px;color:#888;margin:10px 0 8px;font-weight:500">'+recs.length+' alternatives found</div>'+rcards+'</div>';
}

function render(){
  if(S.q)return renderSearch();
  if(S.screen==='detail')return renderDetail();
  if(S.screen==='results')return renderResults();
  if(S.screen==='sun')return renderSunStep();
  renderHome();
}

function sq(v){S.q=v;if(v){S.screen='search';}else{S.screen=S.selSun?'results':S.selCat?'sun':'home';}render();const inp=document.querySelector('.search-input');if(inp){inp.focus();inp.setSelectionRange(v.length,v.length);}}
function clearSearch(){S.q='';render();}
function pickCat(id){S.selCat=id;S.selSun=null;S.screen='sun';S.q='';render();}
function pickSun(id){S.selSun=id;S.screen='results';render();}
function goHome(){S.screen='home';S.selCat=null;S.selSun=null;S.q='';render();}
function goSun(){S.screen='sun';S.selSun=null;render();}
function goBack(){if(S.q){S.screen='search';}else if(S.selSun){S.screen='results';}else{S.screen='home';}render();}
function ss(s){S.sort=s;render();}
function sd(sku){S.sel=sku;S.screen='detail';S.adv=false;render();}
function ta(){S.adv=!S.adv;renderDetail();}
function sa(k,v){S.af[k]=v;renderDetail();}

render();
</script>
</body>
</html>
